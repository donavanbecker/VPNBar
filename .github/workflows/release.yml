name: Release

# Pushing a tag like v1.2.0 builds, signs and notarizes VPN Bar,
# then publishes it as a GitHub Release. See README.md for the required secrets.
on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version from tag
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "::error::The SPARKLE_PRIVATE_KEY secret isn't set, so this release couldn't update installed copies"
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must look like v1.2.0, got $TAG"
            exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Install signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN"
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Build
        run: |
          xcodebuild build \
            -project VPNBar.xcodeproj \
            -scheme VPNBar \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/build" \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
          APP="$RUNNER_TEMP/build/Build/Products/Release/VPN Bar.app"
          Scripts/sign-app.sh "$APP" "Developer ID Application"
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Notarize
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --wait \
            --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID"
          xcrun stapler staple "$APP"
          spctl --assess --type execute --verbose "$APP"

      - name: Package and sign update
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          ASSET="$RUNNER_TEMP/VPN-Bar-$VERSION.zip"
          ditto -c -k --keepParent "$APP" "$ASSET"
          SIGNATURE="$(echo "$SPARKLE_PRIVATE_KEY" | \
            "$RUNNER_TEMP/build/SourcePackages/artifacts/sparkle/Sparkle/bin/sign_update" \
            --ed-key-file - "$ASSET")"
          cat > "$RUNNER_TEMP/appcast.xml" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>VPN Bar</title>
              <item>
                <title>Version $VERSION</title>
                <pubDate>$(LC_ALL=C date -u '+%a, %d %b %Y %H:%M:%S +0000')</pubDate>
                <sparkle:version>$GITHUB_RUN_NUMBER</sparkle:version>
                <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>26.0</sparkle:minimumSystemVersion>
                <sparkle:fullReleaseNotesLink>https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG</sparkle:fullReleaseNotesLink>
                <enclosure url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/VPN-Bar-$VERSION.zip" $SIGNATURE type="application/octet-stream"/>
              </item>
            </channel>
          </rss>
          EOF
          xmllint --noout "$RUNNER_TEMP/appcast.xml"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      # Sparkle reads appcast.xml from the latest release, so publishing is what offers the update.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "$ASSET" "$RUNNER_TEMP/appcast.xml" \
            --title "VPN Bar $VERSION" --generate-notes

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary.p8"
